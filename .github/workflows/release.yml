name: Release

# Push a tag like v0.1.0 (the same number as <Version> in native/TamAPet.csproj) to build and publish a release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the installer and the portable exe
        shell: pwsh
        run: ./native/publish.ps1
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            native/dist/TamAPet-Setup.exe native/dist/TamAPet-Portable.exe native/dist/SHA256SUMS.txt `
            --title "Tam-a-Pet ${{ github.ref_name }}" --generate-notes
