name: Release

# Push a tag like v0.0.1 (the same number as <Version> in native/TamAPet.csproj) to build and publish a release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the installer and the portable exe
        shell: pwsh
        run: ./native/publish.ps1
      - name: Attach the files to the release (created here if it does not exist yet)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = "native/dist/TamAPet-Setup.exe", "native/dist/TamAPet-Portable.exe", "native/dist/SHA256SUMS.txt"
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload "${{ github.ref_name }}" @files --clobber }
          else { gh release create "${{ github.ref_name }}" @files --title "Tam-a-Pet ${{ github.ref_name }}" --generate-notes }
