name: Release

# Push a tag like v0.1.0 (the same number as <Version> in native/TamAPet.csproj) to build and publish a release,
# or run the workflow by hand from the Actions tab giving the tag to create
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (the same number as <Version> in native/TamAPet.csproj)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the portable exe, the installer (the same exe under another name) and the checksums
        shell: pwsh
        run: |
          $dist = "native/dist"
          dotnet publish native/TamAPet.csproj -c Release -r win-x64 --self-contained true -o "$dist/build"
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          Move-Item "$dist/build/TamAPet.exe" "$dist/TamAPet-Portable.exe"
          Copy-Item "$dist/TamAPet-Portable.exe" "$dist/TamAPet-Setup.exe"
          Remove-Item "$dist/build" -Recurse -Force
          Get-ChildItem "$dist/*.exe" | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content "$dist/SHA256SUMS.txt"
      - name: Attach the files to the release (created here if it does not exist yet)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $files = "native/dist/TamAPet-Setup.exe", "native/dist/TamAPet-Portable.exe", "native/dist/SHA256SUMS.txt"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:TAG @files --clobber }
          else { gh release create $env:TAG @files --target "${{ github.sha }}" --title "Tam-a-Pet $env:TAG" --generate-notes }
