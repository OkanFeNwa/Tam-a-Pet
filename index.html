<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Desktop Pet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 256px;
      height: 256px;
      overflow: hidden;
      -webkit-app-region: no-drag;
      background: transparent;
    }

    #pet-container {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    #pet {
      width: 128px;
      height: 128px;
      position: absolute;
      bottom: 20px;
      left: 64px;
      background-image: url('cat-sprite.png');
      background-size: 1024px 1280px;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

  </style>
</head>
<body>
  <div id="pet-container">
    <div id="pet" class="idle"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
